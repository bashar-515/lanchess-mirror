<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>LANCHESS</title>

      <style>
        body {
          margin: 0;
          height: 100dvh;
          display: grid;
          place-items: center;
          background: #8EB1C7;
        }

        .qr {
          --gap: clamp(48px, 7.5vmin, 96px);
          width: calc(100vmin - 2 * var(--gap));
          aspect-ratio: 1;
          background: #D33F49;
          padding: 24px;
          box-sizing: border-box ;
        } 

        .qr a {
          display: block;
          width: 100%;
          height: auto;
        }

        .qr img {
          display: block;
          width: 100%;
          height: auto;
        }
      </style>

  </head>

  <body>
    <div class="qr">
      <a href="https://lanchess.gg/">
        <img src="qr.svg" alt="QR code for lanchess.gg" />
      </a>
    </div>
  </body>
</html>
